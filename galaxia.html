        /* Efecto de brillo suave al pasar el mouse por las frases */
.frase-interactiva {
  cursor: pointer;
  transition: transform 0.3s ease, filter 0.3s ease, text-shadow 0.3s ease;
}

.frase-interactiva:hover {
  transform: scale(1.08);
  filter: brightness(1.3);
}

/* Fondo oscuro difuminado detrás de la carta */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 5, 16, 0.72);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  padding: 20px;
}

.modal-overlay.activo {
  opacity: 1;
  pointer-events: auto;
}

/* Tarjeta de la carta con el color dinámico de la frase */
.carta-frase {
  --card-color: #ffffff;
  background: rgba(15, 16, 36, 0.92);
  border: 1.5px solid var(--card-color);
  box-shadow: 0 0 28px color-mix(in srgb, var(--card-color) 45%, transparent),
              inset 0 0 18px color-mix(in srgb, var(--card-color) 15%, transparent);
  border-radius: 18px;
  max-width: 460px;
  width: 100%;
  padding: 28px 26px;
  text-align: center;
  color: #f4f4f9;
  transform: translateY(22px) scale(0.94);
  opacity: 0;
  transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
              opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}

.modal-overlay.activo .carta-frase {
  transform: translateY(0) scale(1);
  opacity: 1;
}

.carta-frase h3 {
  margin: 0 0 14px;
  font-size: 1.35rem;
  color: var(--card-color);
  text-shadow: 0 0 12px color-mix(in srgb, var(--card-color) 65%, transparent);
  text-transform: capitalize;
}

.carta-frase p {
  margin: 0 0 22px;
  font-size: 1.05rem;
  line-height: 1.6;
  color: #e6e8f5;
}

.btn-cerrar-carta {
  background: transparent;
  color: var(--card-color);
  border: 1px solid var(--card-color);
  padding: 8px 22px;
  border-radius: 999px;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
}

.btn-cerrar-carta:hover {
  background: var(--card-color);
  color: #0b0c1d;
  box-shadow: 0 0 15px var(--card-color);
}

            y1: sy - altoTexto * 0.85,
            y2: sy + altoTexto * 0.35
        };
        ctx.translate(sx, sy);
        ctx.scale(escalaTexto, escalaTexto);
        ctx.textAlign = 'center';
        ctx.shadowColor = obj.color;
        ctx.shadowBlur = esHover ? 28 : 12;
        ctx.fillStyle = obj.color;
        ctx.fillText(obj.texto, 0, 0);
        if (esHover) ctx.fillText(obj.texto, 0, 0);
    }
    ctx.restore();
}

        function render() {
            tiempo += 0.05; if (!arrastrando) rotY += 0.004;
            ctx.clearRect(0, 0, w, h);

            estrellas.forEach(function(e) {
                ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + Math.abs(Math.sin(tiempo + e.fase)) * 0.65) + ')';
                ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
            });

            var cx = w / 2, cy = h / 2, cosY = Math.cos(rotY), sinY = Math.sin(rotY), cosX = Math.cos(rotX), sinX = Math.sin(rotX), fov = 780;

                        // Efecto neón azul eléctrico súper brillante sin lag
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
                        // Dibujo de la galaxia (Violeta dentro -> Azul medio -> Blanco fuera) + Letra "A"
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            anillo.forEach(function(p) {
                var x1 = p.x * cosY - p.z * sinY, z1 = p.z * cosY + p.x * sinY, y2 = p.y * cosX - z1 * sinX, z2 = z1 * cosX + p.y * sinX;
                var esc = (fov / (fov + z2)) * zoom;
                if (esc <= 0.1) return;
                var sx = cx + x1 * esc, sy = cy + y2 * esc, r = (p.esLetra ? 1.8 : 1.4) * esc;

                if (p.esLetra) {
                    // LETRA "A" DE AMBAR: Brillo blanco cian súper nítido
                    ctx.fillStyle = 'rgba(0, 210, 255, 0.45)';
                    ctx.fillRect(sx - r * 2.5, sy - r * 2.5, r * 5, r * 5);
                    ctx.fillStyle = 'rgba(255, 255, 255, 1)';
                    ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
                } else if (p.borde > 0.42) {
                    // POR FUERA (Bordes): Blanco plateado brillante
                    ctx.fillStyle = 'rgba(140, 225, 255, 0.35)';
                    ctx.fillRect(sx - r * 2.2, sy - r * 2.2, r * 4.4, r * 4.4);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                    ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
                } else if (p.borde > 0.16) {
                    // EN MEDIO: Tu azul eléctrico y cian intenso
                    ctx.fillStyle = 'rgba(0, 145, 255, 0.34)';
                    ctx.fillRect(sx - r * 2.3, sy - r * 2.3, r * 4.6, r * 4.6);
                    ctx.fillStyle = 'rgba(92, 240, 255, 0.88)';
                    ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
                } else {
                    // POR DENTRO (Núcleo del brazo): Violeta amatista
                    ctx.fillStyle = 'rgba(165, 85, 255, 0.42)';
                    ctx.fillRect(sx - r * 2.4, sy - r * 2.4, r * 4.8, r * 4.8);
                    ctx.fillStyle = 'rgba(215, 165, 255, 0.95)';
                    ctx.fillRect(sx - r, sy - r, r * 2, r * 2);
                }
            });
            ctx.restore();

            var atras = new Set();
            var adelante = new Set();
            objetos3D.forEach(function(obj) {
                obj.x1 = obj.x * cosY - obj.z * sinY;
                var z1 = obj.z * cosY + obj.x * sinY;
                obj.y2 = obj.y * cosX - z1 * sinX;
                obj.z2 = z1 * cosX + obj.y * sinX;
                if (obj.z2 > 0) atras.add(obj);
                else adelante.add(obj);
            });

            atras.forEach(function(obj) { dibujarObjeto(obj, cx, cy, fov); });

                        var tamCentro = (165 + Math.sin(tiempo) * 7) * zoom;
            ctx.save();
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;
            if (imgCentro.complete && imgCentro.naturalWidth > 0) {
                ctx.drawImage(imgCentro, cx - tamCentro / 2, cy - tamCentro * 0.62, tamCentro, tamCentro);
            }
            ctx.restore();

            adelante.forEach(function(obj) { dibujarObjeto(obj, cx, cy, fov); });

            requestAnimationFrame(render);
        }
        render();
                (function crearIconoEmilia() {
            var canvasIco = document.createElement('canvas');
            canvasIco.width = 64; canvasIco.height = 64;
            var ctxIco = canvasIco.getContext('2d');
            ctxIco.beginPath(); ctxIco.arc(32, 29, 28, Math.PI, 0); ctxIco.lineTo(61, 62); ctxIco.lineTo(3, 62); ctxIco.closePath();
            ctxIco.fillStyle = '#f1f2f6'; ctxIco.fill();
            ctxIco.beginPath(); ctxIco.arc(32, 36, 20, 0, Math.PI * 2); ctxIco.fillStyle = '#ffe5d9'; ctxIco.fill();
            ctxIco.beginPath(); ctxIco.moveTo(11, 30); ctxIco.quadraticCurveTo(32, 10, 53, 30); ctxIco.quadraticCurveTo(40, 24, 32, 30); ctxIco.quadraticCurveTo(24, 24, 11, 30); ctxIco.fillStyle = '#ffffff'; ctxIco.fill();
            ctxIco.beginPath(); ctxIco.moveTo(10, 14); ctxIco.lineTo(21, 18); ctxIco.lineTo(15, 26); ctxIco.closePath(); ctxIco.fillStyle = '#ffffff'; ctxIco.fill(); ctxIco.strokeStyle = '#8c7ae6'; ctxIco.lineWidth = 2; ctxIco.stroke();
            ctxIco.beginPath(); ctxIco.ellipse(23, 37, 3.5, 4.8, 0, 0, Math.PI * 2); ctxIco.fillStyle = '#6c5ce7'; ctxIco.fill();
            ctxIco.beginPath(); ctxIco.moveTo(36, 37); ctxIco.quadraticCurveTo(41, 32, 46, 37); ctxIco.strokeStyle = '#6c5ce7'; ctxIco.lineWidth = 3; ctxIco.lineCap = 'round'; ctxIco.stroke();
            ctxIco.beginPath(); ctxIco.arc(32, 45, 3.8, 0.1 * Math.PI, 0.9 * Math.PI); ctxIco.strokeStyle = '#ff7675'; ctxIco.lineWidth = 2.5; ctxIco.stroke();
            document.getElementById('favicon-emilia').href = canvasIco.toDataURL('image/png');
        })();
    </script>
